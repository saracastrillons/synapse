# Full stack: PostgreSQL 17 + PostGIS 3.5 + pgRouting 3.8, Redis, API and web.
#   docker compose up --build      → web on http://localhost:8080, API docs on http://localhost:8010/docs
services:
  db:
    image: pgrouting/pgrouting:17-3.5-3.8
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://synapse:synapse@db:5432/synapse
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32-chars}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost:5191
      # LLM copilot (optional): put GEMINI_API_KEY=... in a .env file next to this compose file
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8010
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
